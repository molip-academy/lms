name: front

on:
  push:
    branches: [main]
    paths:
      - 'front-react/**'
      - '.github/workflows/front.yml'
  pull_request:
    paths:
      - 'front-react/**'
      - '.github/workflows/front.yml'

concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-react

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front-react/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc 가 build 안에 포함되어 있어 타입 오류도 여기서 걸린다.
      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: front-dist
          path: front-react/dist
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front-react/package-lock.json

      - run: npm ci
        working-directory: front-react

      - name: Download dist
        uses: actions/download-artifact@v5
        with:
          name: front-dist
          path: front-react/dist

      # secret 이 없으면 배포를 건너뛴다. 없다고 CI 를 빨간불로 두면
      # build 실패와 secret 미설정을 구분할 수 없게 된다.
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=배포 건너뜀::CLOUDFLARE_API_TOKEN secret 이 없어 Cloudflare 배포를 건너뛴다. 등록하면 다음 push 부터 자동 배포된다."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: front-react
          command: deploy
