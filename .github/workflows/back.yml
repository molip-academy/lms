name: back

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'

# 같은 branch 에서 새 push 가 나면 이전 실행을 취소한다.
concurrency:
  group: back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: back-test-report
          path: back/build/reports/tests/test

  deploy:
    name: deploy
    # test 가 배포 gate 다. 실패하면 배포하지 않는다.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # railway.json 이 back/ 에 있고 Dockerfile 경로도 back/ 기준이다.
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v5

      # secret 이 없으면 배포를 건너뛴다. 없다고 CI 를 빨간불로 두면
      # test 실패와 secret 미설정을 구분할 수 없게 된다.
      - name: Check deploy credentials
        id: creds
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=배포 건너뜀::RAILWAY_TOKEN secret 이 없어 Railway 배포를 건너뛴다. 등록하면 다음 push 부터 자동 배포된다."
          fi

      - name: Install Railway CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install -g @railway/cli

      # Railway 의 GitHub 자동 연동은 쓰지 않는다. 그쪽은 이 test gate 를 우회하기 때문이다.
      # Railway **project token** 을 쓴다 (프로젝트 설정 > Tokens 에서 발급).
      # project token 은 프로젝트와 environment 에 이미 묶여 있으므로
      # --project / --environment 를 줄 필요가 없다.
      # 계정 토큰(Account settings > Tokens)은 변수 이름이 RAILWAY_API_TOKEN 으로 달라 동작하지 않는다.
      - name: Deploy to Railway
        if: steps.creds.outputs.ready == 'true'
        run: railway up --service back --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
