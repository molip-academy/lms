name: back

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'

# 같은 branch 에서 새 push 가 나면 이전 실행을 취소한다.
concurrency:
  group: back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: back-test-report
          path: back/build/reports/tests/test

  deploy:
    name: deploy
    # test 가 배포 gate 다. 실패하면 배포하지 않는다.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # railway.json 이 back/ 에 있고 Dockerfile 경로도 back/ 기준이다.
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v5

      # secret 이 없으면 배포를 건너뛴다. 없다고 CI 를 빨간불로 두면
      # test 실패와 secret 미설정을 구분할 수 없게 된다.
      - name: Check deploy credentials
        id: creds
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=배포 건너뜀::RAILWAY_TOKEN secret 이 없어 Railway 배포를 건너뛴다. 등록하면 다음 push 부터 자동 배포된다."
          fi

      - name: Install Railway CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install -g @railway/cli

      # Railway 의 GitHub 자동 연동은 쓰지 않는다. 그쪽은 이 test gate 를 우회하기 때문이다.
      # Railway 는 token 종류에 따라 읽는 환경변수가 다르다.
      #   project token  -> RAILWAY_TOKEN
      #   account token  -> RAILWAY_API_TOKEN
      # 어느 쪽을 발급했든 동작하도록 같은 secret 을 둘 다에 넣는다.
      - name: Deploy to Railway
        if: steps.creds.outputs.ready == 'true'
        run: railway up --service back --project "$RAILWAY_PROJECT_ID" --environment production --ci
        env:
          # account token 을 쓴다. RAILWAY_TOKEN(project token)과 동시에 주면
          # CLI 가 그쪽을 먼저 보고 Unauthorized 로 떨어진다.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ab71aadc-0edc-4402-a3d3-b65ff3e72589
