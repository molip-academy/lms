name: back

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'

# 같은 branch 에서 새 push 가 나면 이전 실행을 취소한다.
concurrency:
  group: back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: back-test-report
          path: back/build/reports/tests/test

  deploy:
    name: deploy
    # test 가 배포 gate 다. 실패하면 배포하지 않는다.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # railway.json 이 back/ 에 있고 Dockerfile 경로도 back/ 기준이다.
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Railway 의 GitHub 자동 연동은 쓰지 않는다. 그쪽은 이 test gate 를 우회하기 때문이다.
      - name: Deploy to Railway
        run: railway up --service back --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ab71aadc-0edc-4402-a3d3-b65ff3e72589
