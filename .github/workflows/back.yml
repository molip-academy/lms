name: back

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'

# 같은 branch 에서 새 push 가 나면 이전 실행을 취소한다.
concurrency:
  group: back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: back-test-report
          path: back/build/reports/tests/test

  # 배포는 Railway 의 GitHub 연동이 담당한다 (main push 시 자동).
  # Railway 서비스 설정의 "Wait for CI" 를 켜두면 위 test job 이 통과해야 배포가 시작되므로,
  # test gate 가 유지된다. 이 설정을 끄면 test 실패한 커밋도 배포된다.
