# ADR 0002: volume 없는 H2 file DB 를 쓴다. container 재배포마다 초기화된다.
spring:
  datasource:
    url: jdbc:h2:file:/app/data/db_prod
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      # ADR 0001: 열려 있으면 인증 없이 DB 전체가 노출된다. 절대 켜지 않는다.
      enabled: false

jwt:
  cookie-secure: true

logging:
  level:
    root: info
